<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMT — Playground</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #0b1220;
        color: #e5e7eb;
      }
      header {
        padding: 12px 16px;
        background: #111827;
        border-bottom: 1px solid #1f2937;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      main {
        padding: 24px;
        display: grid;
        gap: 24px;
        grid-template-columns: minmax(0, 1fr) 360px;
      }
      #lmt-container {
        width: 100%;
        min-height: 420px;
        background: #0f172a;
        border: 1px dashed #334155;
        border-radius: 8px;
        padding: 16px;
        box-sizing: border-box;
      }
      aside {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 8px;
        padding: 16px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        max-height: 70vh;
        overflow: auto;
      }
      .row { display: flex; gap: 8px; align-items: center; }
      input, button {
        background: #1f2937; color: #e5e7eb; border: 1px solid #334155;
        border-radius: 4px; padding: 6px 10px; font: inherit;
      }
      button { cursor: pointer; }
      .badge {
        display: inline-block; padding: 2px 8px; border-radius: 999px;
        background: #1f2937; color: #facc15; font-size: 12px;
      }
      code { color: #facc15; }
      .log-line { padding: 2px 0; border-bottom: 1px solid #1f2937; }
    </style>
  </head>
  <body>
    <header>
      <strong>LMT Playground</strong>
      <span class="badge" id="ver"></span>
      <span class="badge" id="state">idle</span>
      <span style="margin-left:auto">Vite HMR activo · cambios en <code>src/</code> se reflejan al instante.</span>
    </header>

    <main>
      <section>
        <h3 style="margin-top:0">Tracker</h3>
        <p>Fase 1: núcleo conectividad listo. El renderizado SVG llega en Fase 2/3.</p>
        <div id="lmt-container"></div>

        <div class="row" style="margin-top:12px">
          <input id="event-id" value="123456" />
          <button id="load">loadEvent</button>
          <button id="destroy">destroy</button>
        </div>
      </section>

      <aside>
        <strong>Log de eventos LMT</strong>
        <div id="log"></div>
      </aside>
    </main>

    <script type="module">
      import { LMT } from '/src/index.ts';

      const $ver = document.getElementById('ver');
      const $state = document.getElementById('state');
      const $log = document.getElementById('log');
      $ver.textContent = `v${LMT.VERSION}`;

      const log = (label, data) => {
        const line = document.createElement('div');
        line.className = 'log-line';
        line.textContent = `[${new Date().toLocaleTimeString()}] ${label} ${
          data ? JSON.stringify(data).slice(0, 120) : ''
        }`;
        $log.prepend(line);
      };

      const lmt = LMT.create({
        container: '#lmt-container',
        partner: 'demo-feedh',
        theme: { brandName: 'Goal99', primaryColor: '#10b981' },
      });

      lmt.on('connection', ({ state, reason }) => {
        $state.textContent = state;
        log('connection', { state, reason });
      });
      lmt.on('event:loaded', (e) => log('event:loaded', { en: e.en, es: e.es }));
      lmt.on('event:updated', (e) => log('event:updated', { en: e.en }));
      lmt.on('action', (a) => log('action', { Action: a.Action, Team: a.Team, Player: a.Player }));
      lmt.on('error', (e) => log('error', e));
      lmt.on('ready', (e) => log('ready', e));

      document.getElementById('load').onclick = () => {
        const id = document.getElementById('event-id').value.trim();
        if (id) lmt.loadEvent(id);
      };
      document.getElementById('destroy').onclick = () => {
        lmt.destroy();
        log('destroyed');
      };

      window.__lmt = lmt;
      log('lmt created', { partner: 'demo-feedh' });
    </script>
  </body>
</html>
